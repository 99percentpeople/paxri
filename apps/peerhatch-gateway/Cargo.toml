[package]
name = "peerhatch-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
gethostname = "1"
getrandom = "0.4"
toml_edit = "0.25"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "net", "sync"] }
peerhatch-config = { path = "../../crates/peerhatch-config" }
peerhatch-native = { path = "../../crates/peerhatch-native" }
peerhatch-core = { path = "../../crates/peerhatch-core" }
peerhatch-control = { path = "../../crates/peerhatch-control" }

peerhatch-terminal = { path = "../../crates/peerhatch-terminal" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["fs"] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"

[package]
name = "tunnel-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui = "0.2.2"
dirs = "5"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tunnel-control = { path = "../../crates/tunnel-control" }
portable-pty = "0.9"
alacritty_terminal = { version = "0.26", default-features = false }
async-channel = "2"
anyhow = "1"
unicode-segmentation = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
async-io = "2"
x11rb = { version = "0.13", features = ["xinput"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2 = "0.6"
block2 = "0.6"

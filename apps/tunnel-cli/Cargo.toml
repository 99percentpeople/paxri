[package]
name = "tunnel-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "tunnel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-std", "macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tunnel-config = { path = "../../crates/tunnel-config" }
tunnel-native = { path = "../../crates/tunnel-native" }
tunnel-control = { path = "../../crates/tunnel-control" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["stdio", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO"] }

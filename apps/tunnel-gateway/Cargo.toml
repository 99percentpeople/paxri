[package]
name = "tunnel-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
gethostname = "1"
getrandom = "0.4"
toml_edit = "0.25"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tunnel-config = { path = "../../crates/tunnel-config" }
tunnel-native = { path = "../../crates/tunnel-native" }
tunnel-core = { path = "../../crates/tunnel-core" }
tunnel-control = { path = "../../crates/tunnel-control" }

tunnel-terminal = { path = "../../crates/tunnel-terminal" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["fs", "process"] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Threading"] }
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"

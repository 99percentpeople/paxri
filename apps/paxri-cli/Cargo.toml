[package]
name = "paxri-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "paxri"
path = "src/main.rs"

[dependencies]
qrcode = { workspace = true, features = ["svg"] }
anstream = "1"
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-std", "macros", "rt-multi-thread", "signal", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
paxri-config = { path = "../../crates/paxri-config" }
paxri-native = { path = "../../crates/paxri-native" }
paxri-control = { path = "../../crates/paxri-control" }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
dirs = "5"
tempfile = "3"
rustix = { version = "1", features = ["stdio", "termios", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Security"] }

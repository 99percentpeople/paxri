[package]
name = "paxri-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
qrcode.workspace = true
paxri-ui = { path = "../../crates/paxri-ui" }
clap = { version = "4", features = ["derive"] }
gethostname = "1"
fontdb = "0.23"
open = "5"
tokio = { version = "1", features = ["rt-multi-thread"] }
paxri-cli = { path = "../paxri-cli" }
paxri-control = { path = "../../crates/paxri-control" }
paxri-config = { path = "../../crates/paxri-config" }
portable-pty = "0.9"
alacritty_terminal = { version = "0.26", default-features = false }
async-channel = "2"
anyhow = "1"
toml_edit = "0.25"
unicode-segmentation = "1"
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(windows))'.dependencies]
gpui = "0.2.2"

[target.'cfg(windows)'.dependencies]
# The app embeds its own manifest for both desktop and command-line launches.
gpui = { version = "0.2.2", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
async-io = "2"
x11rb = { version = "0.13", features = ["xinput"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSButton", "NSGraphics", "NSControl", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2 = "0.6"
block2 = "0.6"

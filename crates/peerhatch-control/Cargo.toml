[package]
name = "peerhatch-control"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
peerhatch-files = { path = "../peerhatch-files" }
peerhatch-core = { path = "../peerhatch-core" }
peerhatch-terminal = { path = "../peerhatch-terminal" }
peerhatch-config = { path = "../peerhatch-config" }
anyhow = "1"
interprocess = { version = "2.4", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
widestring = "1"

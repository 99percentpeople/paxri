[package]
name = "paxri-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util","net","time","sync","macros","rt"] }
paxri-config = { path = "../paxri-config" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[package]
name = "paxri-files"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
filetime = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[package]
name = "paxri-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
paxri-control = { path = "../paxri-control" }
alacritty_terminal = { version = "0.26", default-features = false }
lyon_path = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
paxri-core = { path = "../paxri-core" }
url = "2"
paxri-config = { path = "../paxri-config" }
portable-pty = "0.9"
ttf-parser = "0.25"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
gpui = { version = "0.2.2", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
gpui_android = { package = "gpui-pre", version = "=0.3.6", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_Ime", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

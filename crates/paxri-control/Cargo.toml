[package]
name = "paxri-control"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
paxri-files = { path = "../paxri-files" }
paxri-core = { path = "../paxri-core" }
paxri-terminal = { path = "../paxri-terminal" }
paxri-config = { path = "../paxri-config" }
anyhow = "1"
interprocess = { version = "2.4", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

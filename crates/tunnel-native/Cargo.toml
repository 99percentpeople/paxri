[package]
name = "tunnel-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
iroh-relay = "1.4.1"
getrandom = "0.4"
crab_nat = "0.8.1"
anyhow = "1"
iroh = { version = "1.4.1", features = ["platform-verifier"] }
iroh-tickets = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["time", "io-util"] }
tunnel-config = { path = "../tunnel-config" }

[dev-dependencies]
iroh-relay = { version = "1.4.1", features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies.tunnel-core]
path = "../tunnel-core"

[target.'cfg(unix)'.dependencies]
netdev = "0.46"

[target.'cfg(windows)'.dependencies]
netdev = "0.45"

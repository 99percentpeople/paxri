[package]
name = "tunnel-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tunnel-terminal = { path = "../tunnel-terminal" }
anyhow = "1"
iroh = { version = "1.4.1", features = ["platform-verifier"] }
iroh-tickets = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["time", "io-util"] }
tunnel-config = { path = "../tunnel-config" }

[dev-dependencies]
iroh-relay = { version = "1.4.1", features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies.tunnel-core]
path = "../tunnel-core"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["fs", "process"] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Threading"] }

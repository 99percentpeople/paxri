[package]
name = "tunnel-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
iroh = { version = "1.4.1", features = ["platform-verifier"] }
iroh-tickets = "1"
tempfile = "3"
tokio = { version = "1", features = ["time", "io-util"] }
tunnel-config = { path = "../tunnel-config" }

[dev-dependencies]
iroh-relay = { version = "1.4.1", features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies.tunnel-core]
path = "../tunnel-core"

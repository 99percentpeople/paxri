[package]
name = "paxri-terminal"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
getrandom = "0.4"
async-channel = "2"
paxri-core = { path = "../paxri-core" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "test-util"] }

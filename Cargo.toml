[workspace]
members = ["crates/*", "apps/*", "mobile/android"]
default-members = ["apps/paxri-gateway", "apps/paxri-cli"]
resolver = "3"

[workspace.dependencies]
qrcode = { version = "0.14.1", default-features = false }

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
publish = false

# Keep GUI edits incremental while optimizing rendering and layout during development.
[profile.dev.package.paxri-gui]
opt-level = 1

[profile.dev.package.gpui]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

[profile.android-dev]
inherits = "dev"
debug = 0

# Optimize the per-frame UI and layout paths in Android development builds.
[profile.android-dev.package.gpui-pre]
opt-level = 2
debug-assertions = false

[profile.android-dev.package.gpui-pre-wgpu]
opt-level = 2

[profile.android-dev.package.wgpu-core]
opt-level = 2

[profile.android-dev.package.wgpu-hal]
opt-level = 2

[profile.android-dev.package.taffy]
opt-level = 2

[profile.android-dev.package.slotmap]
opt-level = 2

[profile.android-dev.package.paxri-ui]
opt-level = 2

[profile.android-dev.package.paxri-android]
opt-level = 2

[profile.android-release]
inherits = "release"
opt-level = "s"
lto = "thin"
strip = "symbols"

[patch.crates-io]
# GPUI 0.2.2 with native desktop pinch input.
gpui = { path = "compat/gpui" }
# GPUI 0.2.2 pulls zed-async-tar, whose xattr 0.2 uses a removed Linux libc alias.
xattr = { path = "compat/xattr" }
# See compat/iroh/LOCAL_CHANGES.md for the native endpoint extensions.
iroh = { path = "compat/iroh" }

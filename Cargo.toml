[workspace]
members = ["crates/*", "apps/*"]
default-members = ["apps/peerhatch-gateway", "apps/peerhatch-cli"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
publish = false

[patch.crates-io]
# GPUI 0.2.2 pulls zed-async-tar, whose xattr 0.2 uses a removed Linux libc alias.
xattr = { path = "compat/xattr" }
# See compat/iroh/LOCAL_CHANGES.md for the native endpoint extensions.
iroh = { path = "compat/iroh" }

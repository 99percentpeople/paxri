name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  queue: max

env:
  RUSTUP_TOOLCHAIN: 1.98.1
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
      - run: cargo test --locked -p paxri-config -p paxri-core -p paxri-files -p paxri-native -p paxri-terminal --lib
      - run: cargo build --locked -p paxri-cli -p paxri-gateway
      - run: python3 scripts/check-gateway.py --file-copy
      - run: python3 scripts/check-gateway.py --pipe-exec

  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --target aarch64-linux-android
      - name: Build and verify the development APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ndk_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android29-clang"
          export CXX_aarch64_linux_android="$ndk_bin/aarch64-linux-android29-clang++"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$ndk_bin/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          python3 mobile/android/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/android/paxri.apk
          if-no-files-found: error
          overwrite: true
          archive: false

  native:
    if: github.event_name != 'pull_request'
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64-glibc }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64-glibc }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64-musl }
          - { runner: windows-2025, platform: windows-x64 }
          - { runner: macos-15, platform: macos-arm64 }
          - { runner: macos-15-intel, platform: macos-amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ matrix.platform == 'windows-x64' && 'target/windows-user-release' || 'target/ci-native' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
      - name: Cache compiled Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> ${{ env.CARGO_TARGET_DIR }}
          key: ${{ matrix.platform }}-${{ hashFiles('packaging/distribution.toml') }}
          cache-bin: false
      - if: endsWith(matrix.platform, '-glibc')
        name: Build on Debian 12 for glibc 2.36 compatibility
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" -e CARGO_TARGET_DIR \
            -e CARGO_INCREMENTAL \
            "rust:${RUSTUP_TOOLCHAIN}-bookworm" bash -eu -c '
              apt-get update -q
              apt-get install -y --no-install-recommends clang cmake pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxi-dev
              bash packaging/build-unix-release.sh
            '
      - if: matrix.platform == 'linux-arm64-musl'
        name: Build the ARM64 musl archive on Alpine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" -e CARGO_TARGET_DIR \
            -e CARGO_INCREMENTAL "rust:${RUSTUP_TOOLCHAIN}-alpine3.23" sh -eu -c '
              apk add --no-cache bash build-base clang cmake pkgconf fontconfig-dev freetype-dev libxkbcommon-dev wayland-dev vulkan-loader-dev libx11-dev libxi-dev
              bash packaging/build-unix-release.sh
            '
      - name: Give the cache action access to container build files
        if: runner.os == 'Linux' && steps.rust-cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "$CARGO_TARGET_DIR" "$HOME/.cargo/registry"
      - if: runner.os == 'macOS'
        run: |
          if ! xcrun --sdk macosx metal -v; then xcodebuild -downloadComponent MetalToolchain; fi
      - if: runner.os == 'macOS'
        env:
          CARGO_BUILD_JOBS: '2'
        run: bash packaging/build-unix-release.sh
      - if: runner.os == 'Windows'
        run: python packaging/windows/build-portable.py
      - name: Extract the Windows ZIP and run the packaged CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "paxri-unpacked"
          Expand-Archive -LiteralPath target/dist/paxri-windows-x64.zip -DestinationPath $dest
          & (Join-Path $dest "paxri.exe") --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/dist/paxri-${{ matrix.platform }}.*
          if-no-files-found: error
          overwrite: true
          archive: false

  docker:
    if: github.event_name != 'pull_request'
    name: Docker linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and exercise the image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paxri
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$IMAGE_TAG" .
          docker run --rm --entrypoint paxri "$image:$IMAGE_TAG" --version
          docker run -d --name smoke "$image:$IMAGE_TAG" --no-relay
          trap 'docker logs smoke | tail -8; docker rm -f smoke >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec smoke paxri status >/dev/null; then break; fi
            sleep 1
          done
          docker exec smoke paxri status >/dev/null
          mkdir -p dist
          docker save "$image:$IMAGE_TAG" | gzip -9n > "dist/paxri-docker-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.tar.gz
          archive: false
          overwrite: true
          if-no-files-found: error
      - name: Push platform image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$IMAGE_TAG-linux-$ARCH"
          docker push "$IMAGE:$IMAGE_TAG-linux-$ARCH"

  package:
    name: Collect build info
    needs: [test, android, native, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: paxri*.*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Collect checksums and Compose settings
        working-directory: dist
        run: |
          cp ../compose.yaml .
          printf 'PAXRI_VERSION=%s\n' "$IMAGE_TAG" > build.env
          sha256sum paxri-* paxri.apk compose.yaml build.env > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paxri-build-info
          path: |
            dist/SHA256SUMS
            dist/compose.yaml
            dist/build.env
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish rolling build
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check publication order
        id: order
        run: |
          if git show-ref --verify --quiet refs/tags/rolling &&
             [[ $(git rev-parse refs/tags/rolling^{commit}) != "$GITHUB_SHA" ]] &&
             git merge-base --is-ancestor "$GITHUB_SHA" refs/tags/rolling; then
            echo 'A newer commit is already published.' >> "$GITHUB_STEP_SUMMARY"
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.order.outputs.publish == 'true'
        with:
          pattern: paxri*.*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Download checksums and Compose settings
        if: steps.order.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paxri-build-info
          path: dist
      - name: Verify release files
        if: steps.order.outputs.publish == 'true'
        working-directory: dist
        run: sha256sum --strict --check SHA256SUMS
      - name: Publish multi-platform dev and commit tags
        if: steps.order.outputs.publish == 'true'
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paxri
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$IMAGE_TAG" -t "$image:dev" \
            "$image:$IMAGE_TAG-linux-amd64" "$image:$IMAGE_TAG-linux-arm64"
      - name: Update the rolling prerelease
        if: steps.order.outputs.publish == 'true'
        run: python3 packaging/publish-rolling.py

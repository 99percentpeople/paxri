name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Rebuilds of the same revision write the same per-architecture image tags.
  group: build-${{ github.ref }}-${{ github.sha }}
  queue: max

env:
  RUSTUP_TOOLCHAIN: 1.98.1
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
      - run: cargo test --locked -p paxri-config -p paxri-core -p paxri-files -p paxri-native -p paxri-terminal --lib
      - run: cargo build --locked -p paxri-cli -p paxri-gateway
      - run: python3 scripts/check-gateway.py --file-copy
      - run: python3 scripts/check-gateway.py --pipe-exec

  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'android-signing' || 'android-preview' }}
      deployment: false
    env:
      CARGO_INCREMENTAL: '0'
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Android JVM dependencies
        id: android-jvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/android/dependencies/*.aar
            target/android/dependencies/*.jar
          key: android-jvm-v1-${{ hashFiles('mobile/android/jvm-dependencies.json') }}
      - name: Fetch and verify Android JVM dependencies
        run: python3 mobile/android/build.py --fetch-dependencies
      - name: Save Android JVM dependencies
        if: steps.android-jvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/android/dependencies/*.aar
            target/android/dependencies/*.jar
          key: ${{ steps.android-jvm-cache.outputs.cache-primary-key }}
      - run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --target aarch64-linux-android
      - name: Build the APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ndk_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android29-clang"
          export CXX_aarch64_linux_android="$ndk_bin/aarch64-linux-android29-clang++"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$ndk_bin/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            python3 mobile/android/build.py --unsigned-release
          else
            python3 mobile/android/build.py
          fi
      - name: Sign the rolling APK and verify its certificate
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CERT_SHA256: 3eec85f0124da768814f023d75d2092de7e80a480986cb7d2e39457b730cc616
        run: |
          umask 077
          key=$(mktemp "$RUNNER_TEMP/paxri-key.XXXXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "${ANDROID_KEYSTORE_BASE64:?Missing Android release keystore}" | base64 --decode > "$key"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          apk=target/android/paxri-android-arm64
          "$signer" sign --ks "$key" --ks-key-alias paxri-release --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "${apk}.apk" "${apk}-unsigned.apk"
          "$signer" verify --verbose --print-certs "${apk}.apk" | grep -Fx "Signer #1 certificate SHA-256 digest: $CERT_SHA256"
          mkdir -p dist/android
          mv "${apk}.apk" dist/android/
      - uses: ./.github/actions/upload-package
        with:
          path: dist/android/paxri-android-arm64.apk

  native:
    if: github.event_name != 'pull_request'
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64-glibc, image: bookworm }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64-glibc, image: bookworm }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64-musl, image: alpine3.23 }
          - { runner: windows-2025, platform: windows-x64 }
          - { runner: macos-15, platform: macos-arm64, cargo_jobs: 2 }
          - { runner: macos-15-intel, platform: macos-amd64, cargo_jobs: 4 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target/ci-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
      - name: Cache compiled Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> ${{ env.CARGO_TARGET_DIR }}
          key: ${{ matrix.platform }}-${{ hashFiles('packaging/distribution.toml') }}
          cache-bin: false
      - if: runner.os == 'Linux'
        name: Build on ${{ matrix.image }}
        env:
          RUST_IMAGE: rust:${{ env.RUSTUP_TOOLCHAIN }}-${{ matrix.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" -e CARGO_TARGET_DIR \
            -e CARGO_INCREMENTAL -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY \
            "$RUST_IMAGE" sh packaging/linux/build-in-container.sh
      - name: Give the cache action access to container build files
        if: runner.os == 'Linux' && steps.rust-cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "$CARGO_TARGET_DIR" "$HOME/.cargo/registry"
      - if: runner.os == 'macOS'
        run: |
          if ! xcrun --sdk macosx metal -v; then xcodebuild -downloadComponent MetalToolchain; fi
      - if: runner.os == 'macOS'
        env:
          CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
        run: bash packaging/build-unix-release.sh
      - if: runner.os == 'Windows'
        run: python packaging/windows/build-portable.py
      - name: Extract the Windows ZIP and run the packaged CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "paxri-unpacked"
          Expand-Archive -LiteralPath dist/native/paxri-windows-x64.zip -DestinationPath $dest
          & (Join-Path $dest "paxri.exe") --version
      - uses: ./.github/actions/upload-package
        with:
          path: dist/native/paxri-${{ matrix.platform }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}

  docker:
    if: github.event_name != 'pull_request'
    name: Docker linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and exercise the image
        shell: bash
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paxri
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$IMAGE_TAG" .
          docker run --rm --entrypoint paxri "$image:$IMAGE_TAG" --version
          docker run -d --name smoke "$image:$IMAGE_TAG" --no-relay
          trap 'docker logs smoke | tail -8; docker rm -f smoke >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec smoke paxri status >/dev/null; then break; fi
            sleep 1
          done
          docker exec smoke paxri status >/dev/null
          mkdir -p dist/docker
          docker save "$image:$IMAGE_TAG" | gzip -9n > "dist/docker/paxri-docker-linux-$ARCH.tar.gz"
      - uses: ./.github/actions/upload-package
        with:
          path: dist/docker/paxri-docker-linux-${{ matrix.arch }}.tar.gz
      - name: Push platform image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$IMAGE_TAG-linux-$ARCH"
          docker push "$IMAGE:$IMAGE_TAG-linux-$ARCH"

  package:
    name: Collect build info
    needs: [test, android, native, docker]
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/collect-build

  publish:
    name: Publish rolling build
    needs: [test, android, native, docker]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: distribution-${{ github.ref }}
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/collect-build
      - name: Publish the multi-platform image for this commit
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paxri
          printf '%s\n' "IMAGE=$image" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$IMAGE_TAG" \
            "$image:$IMAGE_TAG-linux-amd64" "$image:$IMAGE_TAG-linux-arm64"
      - name: Check publication order
        id: order
        run: |
          if git show-ref --verify --quiet refs/tags/rolling &&
             [[ $(git rev-parse refs/tags/rolling^{commit}) != "$GITHUB_SHA" ]] &&
             git merge-base --is-ancestor "$GITHUB_SHA" refs/tags/rolling; then
            echo 'A newer commit is already published.' >> "$GITHUB_STEP_SUMMARY"
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Update the rolling prerelease
        if: steps.order.outputs.publish == 'true'
        run: python3 packaging/publish-rolling.py
      - name: Point the dev image at the published commit
        if: steps.order.outputs.publish == 'true'
        run: docker buildx imagetools create -t "$IMAGE:dev" "$IMAGE:$IMAGE_TAG"

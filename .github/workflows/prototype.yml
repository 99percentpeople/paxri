name: Prototype builds
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  native:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64-glibc }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64-glibc }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64-musl }
          - { runner: windows-2025, platform: windows-x64 }
          - { runner: macos-15, platform: macos-arm64 }
          - { runner: macos-15-intel, platform: macos-amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os != 'Linux'
        run: rustup toolchain install 1.98.1 --profile minimal
      - if: endsWith(matrix.platform, '-glibc')
        name: Build on Debian 12 for glibc 2.36 compatibility
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e CARGO_INCREMENTAL \
            rust:1.98.1-bookworm bash -eu -c '
              apt-get update -q
              apt-get install -y --no-install-recommends clang cmake pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxi-dev
              bash packaging/build-unix-release.sh
            '
      - if: matrix.platform == 'linux-arm64-musl'
        name: Build the ARM64 musl archive on Alpine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e CARGO_INCREMENTAL rust:1.98.1-alpine3.23 sh -eu -c '
              apk add --no-cache bash build-base clang cmake pkgconf fontconfig-dev freetype-dev libxkbcommon-dev wayland-dev vulkan-loader-dev libx11-dev libxi-dev
              bash packaging/build-unix-release.sh
            '
      - if: runner.os == 'macOS'
        run: |
          if ! xcrun --sdk macosx metal -v; then xcodebuild -downloadComponent MetalToolchain; fi
      - if: runner.os == 'macOS'
        env:
          CARGO_BUILD_JOBS: '2'
        run: bash packaging/build-unix-release.sh
      - if: runner.os == 'Windows'
        run: python packaging/windows/build-portable.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerhatch-${{ matrix.platform }}
          path: target/dist/peerhatch-${{ matrix.platform }}.*
          if-no-files-found: error
          compression-level: 0

  docker:
    name: Docker linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and exercise the image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$IMAGE_TAG" .
          docker run --rm --entrypoint peerhatch "$image:$IMAGE_TAG" --version
          docker run -d --name smoke "$image:$IMAGE_TAG" --no-relay
          trap 'docker logs smoke | tail -8; docker rm -f smoke >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec smoke peerhatch status >/dev/null; then break; fi
            sleep 1
          done
          docker exec smoke peerhatch status >/dev/null
          mkdir -p dist
          docker save "$image:$IMAGE_TAG" | gzip -9n > "dist/peerhatch-docker-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerhatch-docker-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error
      - name: Push platform image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$IMAGE_TAG-linux-$ARCH"
          docker push "$IMAGE:$IMAGE_TAG-linux-$ARCH"

  package:
    name: Collect build info and publish the prototype image
    needs: [native, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: peerhatch-*
          path: dist
          merge-multiple: true
      - name: Collect checksums and Compose settings
        working-directory: dist
        run: |
          cp ../compose.yaml .
          printf 'PEERHATCH_VERSION=%s\n' "$IMAGE_TAG" > build.env
          sha256sum peerhatch-* compose.yaml build.env > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerhatch-build-info
          path: |
            dist/SHA256SUMS
            dist/compose.yaml
            dist/build.env
          if-no-files-found: error
      - name: Publish multi-platform dev and commit tags
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$IMAGE_TAG" -t "$image:dev" \
            "$image:$IMAGE_TAG-linux-amd64" "$image:$IMAGE_TAG-linux-arm64"

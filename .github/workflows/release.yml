name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        shell: python
        run: |
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"The release tag must match Cargo.toml (v{version})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)

  native:
    needs: version
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: windows-2025, platform: windows-x64 }
          - { runner: macos-15, platform: macos-arm64 }
          - { runner: macos-15-intel, platform: macos-amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os != 'Linux'
        run: rustup toolchain install 1.98.1 --profile minimal
      - if: runner.os == 'Linux'
        name: Build on Debian 12 for glibc 2.36 compatibility
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e CARGO_INCREMENTAL -e CARGO_PROFILE_RELEASE_STRIP \
            rust:1.98.1-bookworm bash -eu -c '
              apt-get update -q
              apt-get install -y --no-install-recommends clang cmake pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxi-dev
              bash packaging/build-unix-release.sh
            '
      - if: runner.os == 'macOS'
        run: |
          if ! xcrun --sdk macosx metal -v; then xcodebuild -downloadComponent MetalToolchain; fi
      - if: runner.os == 'macOS'
        run: bash packaging/build-unix-release.sh
      - if: runner.os == 'Windows'
        run: python packaging/windows/build-portable.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerhatch-${{ matrix.platform }}
          path: target/dist/peerhatch-${{ matrix.platform }}.*
          if-no-files-found: error
          compression-level: 0

  docker:
    needs: version
    name: Docker linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and exercise the image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$VERSION" \
            -t "$image:$VERSION" .
          docker run --rm --entrypoint peerhatch "$image:$VERSION" --version
          docker run -d --name smoke "$image:$VERSION" --no-relay
          trap 'docker logs smoke | tail -8; docker rm -f smoke >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec smoke peerhatch status >/dev/null; then break; fi
            sleep 1
          done
          docker exec smoke peerhatch status >/dev/null
          mkdir -p dist
          docker save "$image:$VERSION" | gzip -1 > "dist/peerhatch-docker-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerhatch-docker-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error
      - name: Push platform image
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-linux-$ARCH"
          docker push "$IMAGE:$VERSION-linux-$ARCH"

  publish:
    name: Publish release and image index
    needs: [version, native, docker]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: peerhatch-*
          path: dist
          merge-multiple: true
      - name: Publish registry tags and release downloads
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$VERSION" -t "$image:latest" \
            "$image:$VERSION-linux-amd64" "$image:$VERSION-linux-arm64"
          cp compose.yaml dist/
          (cd dist && sha256sum peerhatch-* compose.yaml > SHA256SUMS && sha256sum -c SHA256SUMS)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "PeerHatch $GITHUB_REF_NAME" --generate-notes
          fi
          if [[ $(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) == true ]]; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi

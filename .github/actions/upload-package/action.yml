name: Upload package
description: Upload a single distributable file under its original filename.
inputs:
  path:
    description: Path to the package file
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ inputs.path }}
        archive: false
        overwrite: true
        if-no-files-found: error

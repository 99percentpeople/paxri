[package]
name = "paxri-android"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "paxri_android"
crate-type = ["cdylib"]

[dependencies]
paxri-ui = { path = "../../crates/paxri-ui" }
alacritty_terminal = { version = "=0.26.0", default-features = false }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
anyhow = "1"
async-channel = "2"
gpui = { package = "gpui-pre", version = "=0.3.6", default-features = false }
gpui-mobile = { git = "https://github.com/itsbalamurali/gpui-mobile", rev = "5fd54f4554263ae06753e90472c7f2e2ff5d7495", default-features = false, features = ["clipboard"] }
jni = "0.22"
iroh = "=1.4.1"
log = "0.4"
ndk = { version = "0.9", features = ["api-level-29"] }
paxri-config = { path = "../../crates/paxri-config" }
paxri-control = { path = "../../crates/paxri-control" }
paxri-core = { path = "../../crates/paxri-core" }
paxri-native = { path = "../../crates/paxri-native" }
paxri-terminal = { path = "../../crates/paxri-terminal" }
rustls-platform-verifier = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ttf-parser = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
uuid = { version = "1", features = ["v4"] }
